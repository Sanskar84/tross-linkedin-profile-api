[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tross-linkedin-profile-api"
version = "0.1.0"
description = "Browserless LinkedIn profile API hiring challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.14,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
tross-inspect-profile = "tross_linkedin_api.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tross_linkedin_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=tross_linkedin_api --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tross_linkedin_api"]
